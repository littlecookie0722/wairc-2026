name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            run_quality: false
            run_packaging: false
          - python-version: "3.11"
            run_quality: false
            run_packaging: false
          - python-version: "3.12"
            run_quality: true
            run_packaging: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install CPU runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        if: matrix.run_quality
        run: ruff check src wairc_rf tests scripts

      - name: Test
        run: python -m pytest

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: CPU compatibility probe
        run: python scripts/cpu_compatibility.py

      - name: Synthetic end-to-end demo
        run: >-
          wairc demo
          --output-dir "${{ runner.temp }}/wairc-demo"
          --train-samples-per-class 2

      - name: Synthetic benchmark
        run: >-
          wairc benchmark run
          --profile cpu-smoke
          --output-dir "${{ runner.temp }}/wairc-benchmark"

      - name: Synthetic robustness benchmark
        run: >-
          wairc benchmark run
          --profile robustness-small
          --output-dir "${{ runner.temp }}/wairc-robustness"

      - name: Verify redistributable benchmark fixtures
        if: matrix.run_quality
        run: |
          wairc benchmark verify-fixture \
            tests/fixtures/benchmark/synthetic_iq_v1.json \
            --output-dir "${{ runner.temp }}/wairc-fixture-cpu"
          wairc benchmark verify-fixture \
            tests/fixtures/benchmark/synthetic_iq_robustness_v1.json \
            --output-dir "${{ runner.temp }}/wairc-fixture-robustness"

      - name: Build distributions
        if: matrix.run_packaging
        run: python -m build --outdir "${{ runner.temp }}/wairc-dist"

      - name: Verify source distribution documentation
        if: matrix.run_packaging
        shell: bash
        env:
          DIST_DIR: ${{ runner.temp }}/wairc-dist
        run: |
          python - <<'PY'
          import glob
          import os
          import tarfile

          archive = glob.glob(os.path.join(os.environ["DIST_DIR"], "*.tar.gz"))
          assert len(archive) == 1, archive
          with tarfile.open(archive[0]) as source:
              names = source.getnames()
          assert any(name.endswith("/docs/public-api.md") for name in names)
          assert any(name.endswith("/docs/benchmark.md") for name in names)
          assert any(name.endswith("/docs/releases/v0.7.0.md") for name in names)
          assert any(name.endswith("/docs/releases/v0.8.0.md") for name in names)
          assert any(name.endswith("/docs/releases/v0.9.0.md") for name in names)
          assert any(name.endswith("/tests/fixtures/benchmark/synthetic_iq_v1.json") for name in names)
          assert any(name.endswith("/tests/fixtures/benchmark/synthetic_iq_robustness_v1.json") for name in names)
          PY

      - name: Verify wheel from an isolated directory
        if: matrix.run_packaging
        shell: bash
        env:
          WHEEL_DIR: ${{ runner.temp }}/wairc-dist
          VENV_DIR: ${{ runner.temp }}/wairc-wheel-venv
          RUN_DIR: ${{ runner.temp }}/wairc-wheel-run
        run: |
          set -euxo pipefail
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          "$VENV_DIR/bin/python" -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"
          "$VENV_DIR/bin/python" -m pip install --no-deps "$WHEEL_DIR"/*.whl
          mkdir -p "$RUN_DIR"
          cd "$RUN_DIR"
          "$VENV_DIR/bin/python" -m pip check
          "$VENV_DIR/bin/python" -c "from wairc_rf import STFTConfig; assert STFTConfig().profile == 'stft-v1'"
          "$VENV_DIR/bin/wairc" --version
          "$VENV_DIR/bin/wairc" demo --output-dir "$RUN_DIR/demo" --train-samples-per-class 2
